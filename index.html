<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>안전보건 이행점검 · 모바일 서명</title>
<style>
:root{--ink:#1b2430;--ink2:#3a4552;--mute:#5f6b7a;--line:#e3e6ea;--line2:#eef0f3;--canvas:#f5f6f8;--accent:#1f5f99;--ok:#17703f;--okbg:#e7f4ec;--warn:#8a5d00;--warnbg:#fdf3dc;--bad:#a8302c;--badbg:#fcebea;--na:#4f5966;--nabg:#eff1f4}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.5;word-break:keep-all;-webkit-text-size-adjust:100%}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px calc(120px + env(safe-area-inset-bottom))}
.card{background:#fff;border:1px solid var(--line);border-radius:12px}
.head{padding:16px}.head small{color:var(--mute);font-size:13px}.head h1{margin:2px 0 6px;font-size:22px;letter-spacing:-.02em}
.meta{display:flex;flex-wrap:wrap;gap:2px 14px;color:var(--mute);font-size:13.5px}
.score{display:flex;align-items:baseline;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)}
.score b{font-size:28px;color:var(--accent);letter-spacing:-.02em}.score span{color:var(--mute)}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.tag{display:inline-flex;align-items:center;font-style:normal;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:5px;line-height:1.2;white-space:nowrap}
.G{background:var(--okbg);color:var(--ok)}.S{background:var(--warnbg);color:var(--warn)}.B{background:var(--badbg);color:var(--bad)}.N{background:var(--nabg);color:var(--na)}.P{background:var(--line2);color:var(--mute)}
h2{font-size:16px;margin:22px 2px 8px}
.list .it{padding:12px 14px;border-top:1px solid var(--line2)}.list .it:first-child{border-top:0}
.it .t{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600}.it .t .no{color:var(--mute);font-weight:500;min-width:30px;font-variant-numeric:tabular-nums}
.it .t .nm{flex:1}.it p{margin:4px 0 0 38px;color:var(--mute);font-size:13.5px}.it p.ac{color:var(--warn)}
.none{padding:14px;color:var(--mute);font-size:14px}
details.all{margin-top:10px}details.all>summary{list-style:none;cursor:pointer;padding:12px 14px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
details.all>summary::-webkit-details-marker{display:none}details.all>summary::after{content:'펼치기';font-size:13px;color:var(--accent);font-weight:600}details.all[open]>summary::after{content:'접기'}
.cat{padding:10px 14px;background:#fafbfc;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;font-weight:700;font-size:14px}.cat span{color:var(--mute);font-weight:600;font-size:13px;white-space:nowrap}
.role{padding:14px;margin-bottom:12px}
.role .top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.role .top b{font-size:15px}.role .top span{font-size:12.5px;color:var(--mute);font-weight:600}
.role.has .top span{color:var(--accent)}.role.done .top span{color:var(--ok)}
.role label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--mute);margin-bottom:8px}
.role input{flex:1;height:42px;border:1px solid var(--line);border-radius:8px;padding:0 12px;font-size:16px;color:var(--ink);font-family:inherit;background:#fff}
.pad{position:relative;height:200px;border:1.5px dashed #cfd4da;border-radius:10px;background:#fbfcfd;touch-action:none;-webkit-user-select:none;user-select:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.pad .hint{position:absolute;inset:0;display:grid;place-items:center;color:#a2abb6;font-size:14px;pointer-events:none}
.pad.has .hint{display:none}.pad.has{border-style:solid;border-color:var(--accent);background:#fff}
.pad .line{position:absolute;left:18px;right:18px;bottom:46px;border-bottom:1px dashed #d5dae0;pointer-events:none}
.row{display:flex;justify-content:flex-end;margin-top:8px}
button{font-family:inherit;cursor:pointer}
.ghost{height:38px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:14px;font-weight:600}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar .in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.primary{height:52px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:16px;font-weight:700}
.primary:disabled{background:#c5ccd5}
.bar small{text-align:center;color:var(--mute);font-size:12.5px}
.sheet{position:fixed;inset:0;background:rgba(27,36,48,.45);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.on{display:flex}
.sheet .box{width:100%;max-width:640px;background:#fff;border-radius:16px 16px 0 0;padding:20px 16px calc(16px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 6px;font-size:18px}.sheet p{margin:0 0 12px;color:var(--mute);font-size:14px}
.sheet textarea{width:100%;height:110px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;font-family:ui-monospace,Menlo,monospace;color:var(--ink2);resize:none;word-break:break-all}
.sheet .btns{display:flex;gap:8px;margin-top:10px}.sheet .btns button{flex:1}
.sheet .ok{color:var(--ok);font-weight:700;font-size:14px;min-height:20px;margin-top:8px;text-align:center}
.empty{padding:20px 16px}.empty h1{font-size:20px;margin:0 0 6px}.empty p{color:var(--mute);margin:0 0 12px;font-size:14px}
.empty textarea{width:100%;height:120px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;font-family:inherit}
.err{color:var(--bad);font-size:14px;margin-top:8px}
</style></head><body>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" hidden><div class="in"><button class="primary" id="go" disabled>서명 완료 · 회신 코드 만들기</button><small>회신 코드를 서명 요청한 분께 보내면 점검표에 저장됩니다</small></div></div>
<div class="sheet" id="sheet"><div class="box"><h3>회신 코드</h3><p>아래 코드를 복사해서 서명을 요청한 분께 카톡·문자·메일로 보내 주세요. 메일로 요청받았다면 그 메일에 회신하면 됩니다.</p>
<textarea id="code" readonly></textarea><div class="btns"><button class="ghost" id="close">닫기</button><button class="ghost" id="share">공유</button><button class="primary" id="copy" style="height:44px">코드 복사</button></div><div class="ok" id="msg"></div></div></div>
<script>
(function(){
var app=document.getElementById('app');
function E(x){return String(x==null?'':x).replace(/[&<>"]/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m];});}
function b64uToBytes(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';var bin=atob(s),u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function bytesToB64u(u){var bin='';for(var i=0;i<u.length;i+=0x8000)bin+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function streamBytes(u,ctor,fmt){return new Response(new Blob([u]).stream().pipeThrough(new ctor(fmt))).arrayBuffer().then(function(b){return new Uint8Array(b);});}
function decode(code){
  var m=/^U1([zj])\.(.+)$/.exec(code.trim()); if(!m) return Promise.reject(new Error('형식'));
  var u=b64uToBytes(m[2]);
  var p=m[1]==='z'?(typeof DecompressionStream==='undefined'?Promise.reject(new Error('구형')):streamBytes(u,DecompressionStream,'deflate-raw')):Promise.resolve(u);
  return p.then(function(b){return JSON.parse(new TextDecoder().decode(b));});
}
function encode(obj){
  var u=new TextEncoder().encode(JSON.stringify(obj));
  if(typeof CompressionStream==='undefined') return Promise.resolve('R1j.'+bytesToB64u(u));
  return streamBytes(u,CompressionStream,'deflate-raw').then(function(z){return 'R1z.'+bytesToB64u(z);});
}
function fromHash(){ var h=location.hash.replace(/^#/,''); var m=/(?:^|&)d=([^&]+)/.exec(h); return m?decodeURIComponent(m[1]):''; }
function empty(msg){
  app.innerHTML='<div class="card empty"><h1>모바일 서명</h1><p>받은 서명 요청 링크를 열거나, 서명 요청 코드를 아래에 붙여넣어 주세요.</p><textarea id="paste" placeholder="U1z. 로 시작하는 코드 또는 링크"></textarea><div class="row"><button class="ghost" id="open">열기</button></div>'+(msg?'<div class="err">'+E(msg)+'</div>':'')+'</div>';
  document.getElementById('open').onclick=function(){ var v=document.getElementById('paste').value.trim(); var m=/[#&]d=([^&\s]+)/.exec(v); start(m?decodeURIComponent(m[1]):v); };
}
var RN={G:'양호',S:'보완',B:'미흡',N:'해당무','':'미선택'};
function start(code){
  if(!code){ empty(); return; }
  decode(code).then(render).catch(function(e){ empty(e.message==='구형'?'휴대폰 브라우저가 오래되어 열 수 없습니다. 운영체제를 업데이트하거나 다른 브라우저로 열어 주세요.':'코드를 읽지 못했습니다. 링크 전체가 그대로 복사되었는지 확인해 주세요.'); });
}
var D=null,pads={};
function render(d){
  D=d; pads={};
  var acts=[],allHtml='';
  d.cats.forEach(function(c,ci){
    allHtml+='<div class="cat"><div>'+(ci+1)+'. '+E(c[0])+'</div><span>'+E(c[2])+' / '+E(c[1])+'점</span></div>';
    c[3].forEach(function(it,di){
      var no=(ci+1)+'-'+(di+1), r=it[1]||'';
      var row='<div class="it"><div class="t"><span class="no">'+no+'</span><span class="nm">'+E(it[0])+'</span><i class="tag '+(r||'P')+'">'+RN[r]+'</i></div>'+(it[2]?'<p>'+E(it[2])+'</p>':'')+(it[3]?'<p class="ac">조치: '+E(it[3])+'</p>':'')+'</div>';
      allHtml+=row; if(r==='S'||r==='B') acts.push(row);
    });
  });
  var cnt=['G','S','B','N'].map(function(k,i){return '<i class="tag '+k+'">'+RN[k]+' '+(d.c[i]||0)+'</i>';}).join('');
  app.innerHTML='<div class="card head"><small>안전보건 이행점검 · 확인 서명</small><h1>'+E(d.t)+'</h1><div class="meta">'+d.m.map(function(x){return '<span>'+E(x)+'</span>';}).join('')+'</div><div class="score"><span>점수</span><b>'+E(d.sc)+'</b><span>/ '+E(d.mx)+'점</span></div><div class="counts">'+cnt+'</div></div>'
   +'<h2>조치가 필요한 항목</h2><div class="card list">'+(acts.length?acts.join(''):'<div class="none">보완·미흡 항목이 없습니다.</div>')+'</div>'
   +'<details class="card all list"><summary>전체 점검결과 ('+d.cats.reduce(function(n,c){return n+c[3].length;},0)+'항목)</summary>'+allHtml+'</details>'
   +'<h2>서명</h2><div id="roles"></div>';
  var host=document.getElementById('roles');
  d.roles.forEach(function(r){
    var key=r[0],label=r[1],name=r[2],signed=r[3];
    var el=document.createElement('div'); el.className='card role'+(signed?' done':'');
    if(signed){ el.innerHTML='<div class="top"><b>'+E(label)+' · '+E(name)+'</b><span>PC에서 서명 완료</span></div>'; host.appendChild(el); return; }
    el.innerHTML='<div class="top"><b>'+E(label)+'</b><span>서명 전</span></div><label>성명 <input value="'+E(name)+'" autocomplete="off"></label><div class="pad"><span class="line"></span><canvas></canvas><span class="hint">이 칸에 손가락으로 서명해 주세요</span></div><div class="row"><button class="ghost" type="button">지우기</button></div>';
    host.appendChild(el);
    var cv=el.querySelector('canvas'),box=el.querySelector('.pad'),ctx=cv.getContext('2d');
    var p={strokes:[],len:0,name:el.querySelector('input'),el:el,w:0,h:0};
    function size(){ var rc=box.getBoundingClientRect(),dpr=Math.max(1,window.devicePixelRatio||1); p.w=rc.width; p.h=rc.height; cv.width=Math.round(rc.width*dpr); cv.height=Math.round(rc.height*dpr); ctx.setTransform(dpr,0,0,dpr,0,0); draw(); }
    function draw(){ ctx.clearRect(0,0,p.w,p.h); ctx.lineCap='round'; ctx.lineJoin='round'; ctx.strokeStyle='#111'; ctx.lineWidth=2.6; p.strokes.forEach(function(s){ ctx.beginPath(); s.forEach(function(q,i){ i?ctx.lineTo(q[0],q[1]):ctx.moveTo(q[0],q[1]); }); if(s.length===1) ctx.lineTo(s[0][0]+.1,s[0][1]+.1); ctx.stroke(); }); }
    var cur=null;
    function pos(e){ var rc=cv.getBoundingClientRect(); return [Math.round(e.clientX-rc.left),Math.round(e.clientY-rc.top)]; }
    cv.addEventListener('pointerdown',function(e){ e.preventDefault(); try{cv.setPointerCapture(e.pointerId);}catch(x){} cur=[pos(e)]; p.strokes.push(cur); draw(); });
    cv.addEventListener('pointermove',function(e){ if(!cur) return; e.preventDefault(); var q=pos(e),l=cur[cur.length-1],dd=Math.hypot(q[0]-l[0],q[1]-l[1]); if(dd<1.5) return; p.len+=dd; cur.push(q); draw(); box.classList.add('has'); check(); });
    ['pointerup','pointercancel'].forEach(function(t){ cv.addEventListener(t,function(){ cur=null; check(); }); });
    el.querySelector('.row .ghost').onclick=function(){ p.strokes=[]; p.len=0; box.classList.remove('has'); draw(); check(); };
    window.addEventListener('resize',function(){ var ow=p.w; size(); });
    setTimeout(size,0);
    pads[key]=p;
  });
  document.getElementById('bar').hidden=false; check();
}
var go=document.getElementById('go');
function ready(){ return Object.keys(pads).filter(function(k){ return pads[k].len>40; }); }
function check(){ Object.keys(pads).forEach(function(k){ var p=pads[k],s=p.len>40; p.el.classList.toggle('has',s); p.el.querySelector('.top span').textContent=s?'서명함':'서명 전'; }); var n=ready().length; go.disabled=!n; go.textContent=n?('서명 '+n+'개 완료 · 회신 코드 만들기'):'서명 완료 · 회신 코드 만들기'; }
function pack(p){
  var out=[]; p.strokes.forEach(function(s){ var a=[s[0][0],s[0][1]]; for(var i=1;i<s.length;i++){ a.push(s[i][0]-s[i-1][0],s[i][1]-s[i-1][1]); } out.push(a); });
  return {n:(p.name.value||'').trim().slice(0,40),w:Math.round(p.w),h:Math.round(p.h),s:out};
}
go.onclick=function(){
  var keys=ready(); if(!keys.length) return;
  var obj={v:1,id:D.id,t:D.t,at:new Date().toISOString(),g:{}};
  keys.forEach(function(k){ obj.g[k]=pack(pads[k]); });
  encode(obj).then(function(code){ document.getElementById('code').value=code; document.getElementById('msg').textContent=''; document.getElementById('sheet').classList.add('on'); });
};
document.getElementById('close').onclick=function(){ document.getElementById('sheet').classList.remove('on'); };
document.getElementById('copy').onclick=function(){
  var t=document.getElementById('code'), msg=document.getElementById('msg');
  function done(){ msg.textContent='복사했습니다. 서명을 요청한 분께 카톡·문자·메일로 보내 주세요.'; }
  function fallback(){ t.focus(); t.select(); t.setSelectionRange(0,t.value.length); try{ if(document.execCommand('copy')) return done(); }catch(e){} msg.textContent='코드를 길게 눌러 전체 선택 후 복사해 주세요.'; }
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(t.value).then(done,fallback); else fallback();
};
document.getElementById('share').onclick=function(){
  var v=document.getElementById('code').value;
  if(navigator.share) navigator.share({text:v}).catch(function(){}); else document.getElementById('copy').click();
};
start(fromHash());
window.addEventListener('hashchange',function(){ start(fromHash()); });
})();
</script></body></html>
